issuer: Saldac

keywords:
  # Note: Il semblerait qu'il y ait plusieurs établissements secondaire
  # - 44206081000011
  # - 44206081000029
  - "FR91442060810"
  - "Montant HT +Tx TVA"

fields:
  version:
    parser: static
    value: 2
  vat:
    parser: static
    value: "FR91442060810"
  amount:
    parser: regex
    type: float
    regex: Total TTC\s+(\d+\.\d+)
  amount_untaxed:
    parser: regex
    type: float
    regex: Total HT\s+(\d+\.\d+)
  invoice_number:
    parser: regex
    regex: Facture N°.*\s+(FA[\w+|\/]+)
  date:
    parser: regex
    type: date
    regex: Facture N°.*\s+FA[\w+|\/]+ +(\d{2}\/\d{2}\/\d{2})
  date_due:
    parser: regex
    type: date
    regex: \d{2}\/\d{2}\/\d{2}.*(\d{2}\/\d{2}\/\d{4})
  vat_code_055:
    parser: static
    value: "5.5"
  vat_code_200:
    parser: static
    value: "20.0"
  lines:
    parser: lines
    start: Réf.*TVA
    end: Code +Base
    # Note: Dans 'P.U net HT', il y a le prix brut. Tout va bien
    line: ^ *(?P<product_code>\w+) *(?P<product_name>.*) +(?P<quantity>\d+) +((?P<discount>\d+(\.\d+)?)%)? +(?P<price_unit>\d+\.\d+) +(?P<price_subtotal>\d+\.\d+) +(?P<vat_code>\d+\.\d+)
    types:
      quantity: float
      price_unit: float
      discount: float
      price_subtotal: float

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
    - '%d/%m/%y'
  decimal_separator: '.'
  replace:
    # Standardize the decimal separator. ('1,24' -> '1.24')
    - [',', '.']
    # Remove the thousands separator. ('1 234.56' -> '1234.56')
    - ['(\d+) (\d{3}\.\d{2})', '\g<1>\g<2>']

    # Some product are on two lines
    - [' *(.*)\n\s+(\w+) *(\d+\ *\d+\.\d+\ *\d+\.\d+ *2)', '\g<2>   \g<1>   \g<3>']
    - ['\s+\*spp', '  ']
