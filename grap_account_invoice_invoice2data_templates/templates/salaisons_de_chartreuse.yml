issuer: Les Salaisons de Chartreuse

keywords:
  - "FR81889634747"

fields:
  vat:
    parser: static
    value: "FR81889634747"
  amount:
    parser: regex
    type: float
    regex: Montant total TTC +(\d+\.\d+)
  amount_untaxed:
    parser: regex
    type: float
    regex: Montant total lignes HT +(\d+\.\d+)
  invoice_number:
    parser: regex
    regex: Facture\n +(F\d+-\d+)
  date:
    parser: regex
    type: date
    regex: F\d+-\d+\n +(\d{2}\/\d{2}\/\d{4})
  vat_code_055:
    parser: static
    value: "5.5%"
  lines:
    parser: lines
    start: Désignation
    end: Conditions de paiement
    line: ^(?P<product_code>\w+) - +(?P<product_name>.*) +(?P<price_unit>\d+\.\d+) +(?P<quantity>\d+(\.\d+)?) +(?P<price_subtotal>\d+\.\d+) +(?P<vat_code>\d+.\d+%)
    types:
      quantity: float
      price_unit: float
      price_subtotal: float

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
  decimal_separator: '.'
  replace:
    # Standardize the decimal separator. ('1,24' -> '1.24')
    - [',', '.']
    # Remove the thousands separator. ('1 234.56' -> '1234.56')
    - ['(\d+) (\d{3}\.\d{2})', '\g<1>\g<2>']
