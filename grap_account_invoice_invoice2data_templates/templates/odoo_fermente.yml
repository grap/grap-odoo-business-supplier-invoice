issuer: Activités du réseau

keywords:
  - "#ODOOFERMENTE#"

fields:
  vat:
    parser: regex
    regex: TVA intracommunautaire.*(FR\d+)
  amount:
    parser: regex
    type: float
    regex: Total +(\d+\.\d+)
  amount_untaxed:
    parser: regex
    type: float
    regex: Sous-total +(\d+\.\d+)
  invoice_number:
    parser: regex
    regex: Facture (\w+\/\d+\/\d+)
  date:
    parser: regex
    type: date
    regex: (\d{2}\/\d{2}\/\d{4}) +\d{2}\/\d{2}\/\d{4}
  date_due:
    parser: regex
    type: date
    regex: \d{2}\/\d{2}\/\d{4} +(\d{2}\/\d{2}\/\d{4})
  vat_code_021:
    parser: static
    value: "2.1"
  vat_code_055:
    parser: static
    value: "5.5"
  vat_code_100:
    parser: static
    value: "10.0"
  vat_code_200:
    parser: static
    value: "20.0"
  lines:
    parser: lines
    start: Code +Description
    end: TVA intracommunautaire
    line: ^ +(?P<product_code>\w+-\d+) +(?P<product_name>.*) +(?P<quantity>\d+\.\d+) +(?P<unit_name>[\d+]?[ ]*\w+) +(?P<price_unit>\d+\.\d+) +(?P<discount>\d+\.\d+ +)?(?P<vat_code>\d+\.\d+)% + +(?P<price_subtotal>\d+\.\d+)
    types:
      quantity: float
      price_unit: float
      discount: float
      price_subtotal: float

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
  decimal_separator: '.'
  replace:
    # Standardize the decimal separator. ('1,24' -> '1.24')
    - [',', '.']
    # Remove the thousands separator. ('1 234.56' -> '1234.56')
    - ['(\d+) (\d{3}\.\d{2})', '\g<1>\g<2>']
