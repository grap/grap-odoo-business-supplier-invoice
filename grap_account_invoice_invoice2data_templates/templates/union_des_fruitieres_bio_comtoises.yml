issuer: Union des Fruitières Bio-Comtoises (UFBC)

keywords:
  - "43287265300030"
  - "FR13432872653"

fields:
  vat:
    parser: static
    value: "FR13432872653"
  amount:
    parser: regex
    type: float
    regex: Net à payer +(\d+\.\d+)
  amount_untaxed:
    parser: regex
    type: float
    regex: Total HT Net +(\d+\.\d+)
  invoice_number:
    parser: regex
    regex: (FC\d+) +\d{2}\/\d{2}\/\d{4}
  date:
    parser: regex
    type: date
    regex: FC\d+ +(\d{2}\/\d{2}\/\d{4})
  date_due:
    parser: regex
    type: date
    regex: \d{2}\/\d{2}\/\d{4}.*(\d{2}\/\d{2}\/\d{4})
  vat_code_055:
    parser: static
    value: "5.50"
  lines:
    parser: lines
    start: Code +Nombre
    end: Taux +Base HT
    line: ^ *(?P<product_code>\w+) *(?P<nombre_ignored>\d+\.\d+) +(?P<product_name>.*) +(?P<quantity>\d+\.\d+) +(?P<price_unit>\d+\.\d+) +(?P<price_subtotal>\d+\.\d+) +(?P<vat_code>5\.50)
    types:
      quantity: float
      price_unit: float
      price_subtotal: float

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
  decimal_separator: '.'
  replace:
    # Standardize the decimal separator. ('1,24' -> '1.24')
    - [',', '.']
    # Remove the thousands separator. ('1 234.56' -> '1234.56')
    - ['(\d+) (\d{3}\.\d{2})', '\g<1>\g<2>']
